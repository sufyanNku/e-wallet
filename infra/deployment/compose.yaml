name: ewallet-service
services:
  api:
    build:
      context: ../..
      dockerfile: infra/deployment/Dockerfile
    environment:
      NODE_ENV: production
      EWALLET_MODE: testnet
      EWALLET_PUBLIC_ORIGINS: https://${EWALLET_DOMAIN:?Set the wallet HTTPS domain}
      EWALLET_DATABASE_PATH: /data/backend.sqlite
    volumes:
      - wallet-public-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  edge:
    image: caddy:2.10.2-alpine
    environment:
      EWALLET_DOMAIN: ${EWALLET_DOMAIN:?Set the wallet HTTPS domain}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - edge-certificates:/data
      - edge-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  wallet-public-data:
  edge-certificates:
  edge-config:
