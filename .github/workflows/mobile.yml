name: Native build verification
on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/mobile/**', 'packages/**', 'pnpm-lock.yaml', '.github/workflows/mobile.yml']
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.3'
      - run: npm install --global pnpm@10.34.9
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:typecheck
      - run: pnpm mobile:build:android
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.3'
      - run: npm install --global pnpm@10.34.9
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:typecheck
      - run: pod install --project-directory=apps/mobile/ios
      - name: Compile unsigned simulator app
        run: xcodebuild -workspace apps/mobile/ios/ewallet.xcworkspace -scheme ewallet -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath .local/ios-build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ios-unsigned-simulator-app
          path: .local/ios-build/Build/Products/Release-iphonesimulator/ewallet.app
